[project]
name = "tgbt"
version = "1.0.0"
description = "Çoklu hesap Telegram otomasyon sistemi (aiogram controller bot + Telethon userbot'lar)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
